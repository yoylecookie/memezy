<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://file.garden/Z_Zkhskjxktxt43S/Memezy/logo.v1.png">

    <title>Memezy</title>

    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .header > h1 {
            color: #2f355d;
        }

        #feed {
            color: white;
            background-color: black;
            padding: 10px;
            height: 500px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #feed > img {
            max-height: 480px;
            max-width: 100%;
            object-fit: contain;
        }

        button {
            color: white;
            font-family: "Plus Jakarta Sans", sans-serif;
            background-color: #6374c8;
            border: none;
            width: 300px;
            max-width: 90%;
            height: 50px;
            border-radius: 20px;
            margin-top: 10px;
            cursor: pointer;
            transition: width 0.4s, background-color 0.4s;
        }

        button:hover {
            width: 320px;
            background-color: #637fc8;
        }

        #fav {
            width: 60px;
            position: fixed;
            top: 555px;
            left: 20px;
            transition: transform 0.5s;
            cursor: pointer;
        }

        #fav:hover {
            animation: fav 0.5s forwards;
        }

        @keyframes fav {
            0% { transform: translateY(-15px); }
            50% { transform: translateY(-7px); }
            100% { transform: translateY(-10px); }
        }

        #dashb {
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            #feed {
                height: 400px;
            }

            #feed > img {
                max-height: 380px;
            }

            #fav {
                width: 45px;
                top: auto;
                bottom: 20px;
                left: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <img
            src="https://file.garden/Z_Zkhskjxktxt43S/Memezy/logo.v1.png"
            width="50"
            alt="Memezy logo"
        >
        <h1>Memezy</h1>
    </div>

    <hr>

    <div id="feed">
        <img
            src="https://file.garden/Z_Zkhskjxktxt43S/Memezy/starter.png"
            id="meme"
            alt="Meme"
        >
    </div>

    <img
        src="https://file.garden/Z_Zkhskjxktxt43S/Memezy/fav-off.svg"
        id="fav"
        alt="Favorite this meme"
        title="Favorite this meme"
        role="button"
        tabindex="0"
        aria-pressed="false"
    >

    <button onclick="meme()">Next</button>

    <button onclick="window.open('https://forms.gle/mCNUHejPUPodsJLe7', '_blank', 'noopener,noreferrer')">
        Upload
    </button>

    <div id="dashb"></div>

    <script>
        const MEME_URL =
            "https://file.garden/Z_Zkhskjxktxt43S/Memezy/meme/";

        const FAV_ON =
            "https://file.garden/Z_Zkhskjxktxt43S/Memezy/fav-on.svg";

        const FAV_OFF =
            "https://file.garden/Z_Zkhskjxktxt43S/Memezy/fav-off.svg";

        const FAVORITES_KEY = "memezy_favorites";
        const ACCOUNT_KEY = "username";

        // Create the correct account button.
        const accountName = localStorage.getItem(ACCOUNT_KEY);
        const dashboardContainer = document.getElementById("dashb");
        const accountButton = document.createElement("button");

        if (accountName && accountName.trim() !== "") {
            accountButton.textContent = "Dashboard";
            accountButton.addEventListener("click", () => {
                window.location.href = "/dash.html";
            });
        } else {
            accountButton.textContent = "Create Account";
            accountButton.addEventListener("click", () => {
                window.location.href = "/acc.html";
            });
        }

        dashboardContainer.appendChild(accountButton);

        const memeImage = document.getElementById("meme");
        const favButton = document.getElementById("fav");

        let recentMemes = [];

        function getFavorites() {
            try {
                const saved = JSON.parse(
                    localStorage.getItem(FAVORITES_KEY)
                );

                return Array.isArray(saved) ? saved : [];
            } catch {
                return [];
            }
        }

        function getCurrentMemeId() {
            const match = memeImage.src.match(
                /\/meme\/(\d+)(?:[?#]|$)/i
            );

            return match ? Number(match[1]) : null;
        }

        function updateFavoriteIcon() {
            const id = getCurrentMemeId();

            if (id === null) {
                favButton.src = FAV_OFF;
                favButton.alt = "Favorite this meme";
                favButton.title = "Choose a meme first";
                favButton.setAttribute("aria-pressed", "false");
                return;
            }

            const isFavorite = getFavorites().includes(id);

            favButton.src = isFavorite ? FAV_ON : FAV_OFF;

            favButton.alt = isFavorite
                ? "Remove this meme from favorites"
                : "Favorite this meme";

            favButton.title = isFavorite
                ? "Remove from favorites"
                : "Add to favorites";

            favButton.setAttribute(
                "aria-pressed",
                String(isFavorite)
            );
        }

        function toggleFavorite() {
            const id = getCurrentMemeId();

            if (id === null) return;

            const favorites = getFavorites();
            const index = favorites.indexOf(id);

            if (index !== -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }

            localStorage.setItem(
                FAVORITES_KEY,
                JSON.stringify(favorites)
            );

            updateFavoriteIcon();
        }

        favButton.addEventListener("click", toggleFavorite);

        favButton.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleFavorite();
            }
        });

        function meme() {
            const max = 35;
            let randomMeme;

            do {
                randomMeme = Math.floor(Math.random() * max) + 1;
            } while (recentMemes.includes(randomMeme));

            recentMemes.push(randomMeme);

            if (recentMemes.length > 10) {
                recentMemes.shift();
            }

            memeImage.src = MEME_URL + randomMeme;
            memeImage.alt = "Meme " + randomMeme;

            updateFavoriteIcon();
        }

        updateFavoriteIcon();
    </script>
</body>
</html>
